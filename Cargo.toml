[package]
name = "blender-live"
version = "0.1.3"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
axum = "0.8.9"
base64 = "0.22.1"
http = "1.3.1"
include_dir = "0.7.4"
mime_guess = "2.0.5"
notify = "8.2.0"
rmcp = { version = "3.4.1", features = ["server", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.41", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.19.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_assert_message = "warn"

[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 16
